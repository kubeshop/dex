{{ template "header.html" . }}

<div class="tk-card">
  <div>
    <h1 class="tk-card__title">Grant access</h1>
    {{ if .Scopes }}
    <p class="tk-card__subtitle">{{ .Client }} would like to:</p>
    <ul class="tk-list">
      {{ range $scope := .Scopes }}
      <li>{{ $scope }}</li>
      {{ end }}
    </ul>
    {{ else }}
    <p class="tk-card__subtitle">{{ .Client }} has not requested any personal information.</p>
    {{ end }}
  </div>
  <div class="tk-actions">
    <form method="post">
      <input type="hidden" name="req" value="{{ .AuthReqID }}"/>
      <input type="hidden" name="approval" value="approve">
      <button type="submit" class="tk-btn tk-btn--primary"><span>Grant access</span></button>
    </form>
    <form method="post">
      <input type="hidden" name="req" value="{{ .AuthReqID }}"/>
      <input type="hidden" name="approval" value="rejected">
      <button type="submit" class="tk-btn tk-btn--default"><span>Cancel</span></button>
    </form>
  </div>
</div>

{{ template "footer.html" . }}
